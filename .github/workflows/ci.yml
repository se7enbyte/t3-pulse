name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: zsh build.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict 'build/T3 Pulse.app'
      - name: Check status reader with an isolated fixture
        run: python3 tests/check_store.py
